<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ashish AI{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          },
          colors: {
            primary: "#7c8cff",
            secondary: "#0f172a",
            glass: "rgba(255,255,255,0.06)"
          },
          boxShadow: {
            glow: "0 10px 40px rgba(124,140,255,.18)"
          },
          backdropBlur: {
            xs: "2px"
          }
        }
      }
    }
  </script>

  <style>
    * {
      scroll-behavior: smooth;
    }

    body {

      font-family: Inter, sans-serif;

      background:
        radial-gradient(circle at top left,
          rgba(124, 140, 255, 0.20),
          transparent 28%),

        radial-gradient(circle at bottom right,
          rgba(56, 189, 248, 0.16),
          transparent 30%),

        radial-gradient(circle at center,
          rgba(255, 255, 255, .03),
          transparent 60%),

        #020617;

      overflow-x: hidden;

      position: relative;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 20px;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle,
          rgba(124, 140, 255, 0.18),
          transparent 70%);
      filter: blur(60px);
      z-index: 0;
    }

    .floating-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(90px);
      opacity: .18;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: #7c8cff;
      top: 10%;
      left: -80px;
    }

    .orb-2 {
      width: 240px;
      height: 240px;
      background: #38bdf8;
      bottom: 10%;
      right: -50px;
      animation-delay: 2s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-30px);
      }
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: white;
      opacity: .7;
      animation: bounce 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(.8);
        opacity: .4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .message-enter {
      animation: messageEnter .45s ease;
      will-change: transform, opacity;
    }

    @keyframes messageEnter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ================= FLOATING PARTICLES ================= */

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, .18);
      border-radius: 9999px;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {

      from {
        transform: translateY(0px);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      to {
        transform: translateY(-120vh);
        opacity: 0;
      }

    }

    /* ================= PREMIUM BUTTON ================= */

    .premium-btn {
      position: relative;
      overflow: hidden;
    }

    .premium-btn::before {

      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, .15),
          transparent);

      transition: .8s;
    }

    .premium-btn:hover::before {
      left: 120%;
    }

    /* ================= IMAGE ANIMATION ================= */

    .hero-image {

      animation: heroFloat 6s ease-in-out infinite;

      transition: transform .5s ease;
    }

    .hero-image:hover {
      transform: scale(1.02);
    }

    @keyframes heroFloat {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }

    }

    /* ================= CARD HOVER ================= */

    .feature-card {

      transition:
        transform .35s ease,
        border-color .35s ease,
        background .35s ease;
    }

    .feature-card:hover {

      transform: translateY(-8px);

      border-color: rgba(255, 255, 255, .14);

      background: rgba(255, 255, 255, .07);
    }

    /* ================= CHAT DEPTH ================= */

    .chat-depth {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .05),
        0 30px 80px rgba(0, 0, 0, .45);
    }

    /* ================= ANIMATED BACKGROUND ================= */

    .animated-wave {

      position: fixed;

      width: 1400px;
      height: 1400px;

      border-radius: 9999px;

      filter: blur(120px);

      opacity: .10;

      animation: waveMove 18s ease-in-out infinite;

      pointer-events: none;

      z-index: 0;
    }

    .wave-1 {

      background: #7c8cff;

      top: -400px;
      left: -300px;
    }

    .wave-2 {

      background: #38bdf8;

      bottom: -450px;
      right: -300px;

      animation-delay: 4s;
    }

    @keyframes waveMove {

      0%,
      100% {
        transform: translate(0px, 0px);
      }

      50% {
        transform: translate(40px, -30px);
      }

    }

    /* ================= REVEAL ANIMATION ================= */

    .reveal {

      opacity: 0;

      transform: translateY(40px);

      transition:
        opacity .8s ease,
        transform .8s ease;
    }

    .reveal.active {

      opacity: 1;

      transform: translateY(0px);
    }

    /* ================= CURSOR GLOW ================= */

    .cursor-glow {

      position: fixed;

      width: 300px;
      height: 300px;

      border-radius: 9999px;

      background:
        radial-gradient(circle,
          rgba(124, 140, 255, .12),
          transparent 70%);

      pointer-events: none;

      z-index: 1;

      transform: translate(-50%, -50%);

      transition:
        transform .08s linear;
    }

    /* ================= MIC WAVES ================= */

    .mic-listening {

      position: relative;

      overflow: visible !important;
    }

    .mic-listening::before,
    .mic-listening::after {

      content: "";

      position: absolute;

      inset: -10px;

      border-radius: 24px;

      border: 1px solid rgba(165, 180, 252, .35);

      animation: micWave 2s infinite;
    }

    .mic-listening::after {
      animation-delay: 1s;
    }

    @keyframes micWave {

      0% {
        transform: scale(.95);
        opacity: .8;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }

    }

    /* ================= AI SPEAKING ================= */

    .ai-speaking {

      position: relative;
    }

    .ai-speaking::after {

      content: "";

      position: absolute;

      inset: -6px;

      border-radius: 24px;

      border: 1px solid rgba(125, 211, 252, .35);

      animation: aiSpeakingWave 1.6s infinite;
    }

    @keyframes aiSpeakingWave {

      0% {
        transform: scale(.95);
        opacity: .8;
      }

      100% {
        transform: scale(1.25);
        opacity: 0;
      }

    }

    /* ================= VOICE POPUP ================= */

    #voice-popup {
      padding: 2rem;
    }

    .voice-popup-backdrop {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%,
          rgba(135, 58, 255, .30) 0,
          rgba(72, 24, 172, .24) 26%,
          rgba(21, 11, 78, .88) 58%,
          rgba(8, 5, 34, .98) 100%),
        linear-gradient(180deg,
          rgba(12, 7, 46, .90) 0%,
          rgba(5, 4, 24, .98) 100%);
      backdrop-filter: blur(24px) saturate(125%);
    }

    .voice-orb-stage {
      position: relative;
      padding: clamp(1rem, 2vw, 1.5rem) clamp(1rem, 4vw, 2rem) 0;
      isolation: isolate;
    }

    .voice-orb-stage::before {
      content: "";
      position: absolute;
      inset: -8% -12% 8%;
      z-index: 0;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(circle,
          rgba(108, 47, 255, .28) 0 18%,
          rgba(78, 223, 255, .14) 28%,
          rgba(39, 13, 114, .08) 52%,
          transparent 74%);
      filter: blur(72px);
      opacity: .94;
    }

    #voice-transcript {
      margin-top: 1.5rem;
      color: rgba(233, 236, 255, .92);
      letter-spacing: .09em;
      text-shadow: 0 0 18px rgba(116, 220, 255, .12);
    }

    /* ================= AI ORB ================= */

    .ai-orb-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 0;
      width: min(96vw, 560px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(circle at 50% 50%,
          rgba(255, 255, 255, .12) 0 6%,
          rgba(104, 231, 255, .14) 18%,
          rgba(244, 128, 255, .14) 34%,
          rgba(113, 56, 255, .12) 50%,
          transparent 74%);
      filter: blur(62px);
      opacity: .88;
      animation: glowPulse 8s ease-in-out infinite;
    }

    .ai-orb {
      position: relative;
      z-index: 1;
      width: min(84vw, 460px);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 44%,
          rgba(82, 28, 182, .20) 0 22%,
          rgba(56, 16, 148, .34) 40%,
          rgba(28, 10, 96, .72) 68%,
          rgba(11, 5, 40, .96) 100%);
      box-shadow:
        inset 0 22px 36px rgba(255, 255, 255, .04),
        inset 0 -34px 58px rgba(5, 2, 24, .62),
        0 20px 80px rgba(6, 2, 34, .44);
      animation: orbFloat 10s ease-in-out infinite;
      transform: translateZ(0);
    }

    .ai-orb::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: 50%;
      pointer-events: none;
      background:
        radial-gradient(120% 82% at 50% 10%,
          rgba(255, 222, 249, .18) 0 18%,
          rgba(255, 255, 255, .08) 22%,
          transparent 54%),
        radial-gradient(circle at 18% 18%,
          rgba(255, 255, 255, .10) 0 4%,
          transparent 12%),
        radial-gradient(circle at 50% 50%,
          transparent 66%,
          rgba(255, 255, 255, .03) 76%,
          rgba(255, 255, 255, 0) 82%);
      mix-blend-mode: screen;
      opacity: .78;
    }

    /* ================= VOICE BARS ================= */

    .orb-visualizer {

      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 2;

    }

    .visualizer-bars {

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      height: 220px;

    }

    .voice-bar {

      width: 10px;

      height: 120px;

      border-radius: 999px;

      background:
        linear-gradient(to top,
          rgba(110, 240, 255, .95),
          rgba(255, 255, 255, .98));

      transform-origin: center center;

      transform: scaleY(.35);

      opacity: .3;

      transition:
        transform 70ms linear,
        opacity 70ms linear,
        height 70ms linear;

      box-shadow:
        0 0 12px rgba(110, 240, 255, .35),
        0 0 30px rgba(190, 120, 255, .18);

    }


    .orb-ring {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-ring::before,
    .orb-ring::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-ring::before {
      inset: 6px;
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, .02),
        0 0 0 1px rgba(255, 255, 255, .04);
    }

    .orb-ring::after {
      inset: -3px;
      background:
        conic-gradient(from 205deg,
          rgba(92, 244, 255, .92) 0deg,
          rgba(194, 251, 255, .42) 60deg,
          rgba(255, 228, 248, .88) 132deg,
          rgba(238, 143, 255, .82) 208deg,
          rgba(112, 56, 255, .40) 286deg,
          rgba(92, 244, 255, .92) 360deg);
      -webkit-mask:
        radial-gradient(farthest-side,
          transparent calc(100% - 20px),
          #000 calc(100% - 12px),
          transparent calc(100% - 4px));
      mask:
        radial-gradient(farthest-side,
          transparent calc(100% - 20px),
          #000 calc(100% - 12px),
          transparent calc(100% - 4px));
      filter: blur(10px);
      opacity: .96;
    }

    @keyframes orbFloat {

      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(0, -8px, 0);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: .78;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.03);
        opacity: .92;
      }
    }
  </style>
</head>

<body class="text-white min-h-screen grid-bg relative overflow-x-hidden">

  <!-- CURSOR GLOW -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- WAVES -->
  <div class="animated-wave wave-1"></div>
  <div class="animated-wave wave-2"></div>

  <!-- ORBS -->
  <div class="floating-orb orb-1"></div>
  <div class="floating-orb orb-2"></div>

  <!-- PARTICLES -->
  <div class="particles" id="particles"></div>

  {% block content %}{% endblock %}
  <script>

    /* ================= PARTICLES ================= */

    const particlesContainer =
      document.getElementById("particles");

    for (let i = 0; i < 65; i++) {

      const particle =
        document.createElement("div");

      particle.classList.add("particle");

      particle.style.left =
        Math.random() * 100 + "vw";

      particle.style.top =
        Math.random() * 100 + "vh";

      particle.style.animationDuration =
        (10 + Math.random() * 18) + "s";

      particle.style.animationDelay =
        Math.random() * 10 + "s";

      particle.style.opacity =
        (.2 + Math.random() * .5);

      particlesContainer.appendChild(particle);

    }

    /* ================= CURSOR GLOW ================= */

    const glow =
      document.getElementById("cursorGlow");

    window.addEventListener("mousemove", (e) => {

      glow.style.left = e.clientX + "px";

      glow.style.top = e.clientY + "px";

    });

    /* ================= REVEAL ================= */

    const reveals =
      document.querySelectorAll(".reveal");

    function revealSections() {

      reveals.forEach(section => {

        const top =
          section.getBoundingClientRect().top;

        if (top < window.innerHeight - 100) {

          section.classList.add("active");

        }

      });

    }

    window.addEventListener("scroll", revealSections);

    revealSections();

  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/js/chat.js"></script>
</body>

</html>
