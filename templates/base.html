<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ashish AI{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"]
          },
          colors: {
            primary: "#7c8cff",
            secondary: "#0f172a",
            glass: "rgba(255,255,255,0.06)"
          },
          boxShadow: {
            glow: "0 10px 40px rgba(124,140,255,.18)"
          },
          backdropBlur: {
            xs: "2px"
          }
        }
      }
    }
  </script>

  <style>
    * {
      scroll-behavior: smooth;
    }

    body {

      font-family: Inter, sans-serif;

      background:
        radial-gradient(circle at top left,
          rgba(124, 140, 255, 0.20),
          transparent 28%),

        radial-gradient(circle at bottom right,
          rgba(56, 189, 248, 0.16),
          transparent 30%),

        radial-gradient(circle at center,
          rgba(255, 255, 255, .03),
          transparent 60%),

        #020617;

      overflow-x: hidden;

      position: relative;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .12);
      border-radius: 20px;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle,
          rgba(124, 140, 255, 0.18),
          transparent 70%);
      filter: blur(60px);
      z-index: 0;
    }

    .floating-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(90px);
      opacity: .18;
      animation: float 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 280px;
      height: 280px;
      background: #7c8cff;
      top: 10%;
      left: -80px;
    }

    .orb-2 {
      width: 240px;
      height: 240px;
      background: #38bdf8;
      bottom: 10%;
      right: -50px;
      animation-delay: 2s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-30px);
      }
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: white;
      opacity: .7;
      animation: bounce 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: .2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(.8);
        opacity: .4;
      }

      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .message-enter {
      animation: messageEnter .45s ease;
      will-change: transform, opacity;
    }

    @keyframes messageEnter {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ================= FLOATING PARTICLES ================= */

    .particles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, .18);
      border-radius: 9999px;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {

      from {
        transform: translateY(0px);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      to {
        transform: translateY(-120vh);
        opacity: 0;
      }

    }

    /* ================= PREMIUM BUTTON ================= */

    .premium-btn {
      position: relative;
      overflow: hidden;
    }

    .premium-btn::before {

      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 100%;
      height: 100%;

      background:
        linear-gradient(90deg,
          transparent,
          rgba(255, 255, 255, .15),
          transparent);

      transition: .8s;
    }

    .premium-btn:hover::before {
      left: 120%;
    }

    /* ================= IMAGE ANIMATION ================= */

    .hero-image {

      animation: heroFloat 6s ease-in-out infinite;

      transition: transform .5s ease;
    }

    .hero-image:hover {
      transform: scale(1.02);
    }

    @keyframes heroFloat {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-12px);
      }

    }

    /* ================= CARD HOVER ================= */

    .feature-card {

      transition:
        transform .35s ease,
        border-color .35s ease,
        background .35s ease;
    }

    .feature-card:hover {

      transform: translateY(-8px);

      border-color: rgba(255, 255, 255, .14);

      background: rgba(255, 255, 255, .07);
    }

    /* ================= CHAT DEPTH ================= */

    .chat-depth {
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, .05),
        0 30px 80px rgba(0, 0, 0, .45);
    }

    /* ================= ANIMATED BACKGROUND ================= */

    .animated-wave {

      position: fixed;

      width: 1400px;
      height: 1400px;

      border-radius: 9999px;

      filter: blur(120px);

      opacity: .10;

      animation: waveMove 18s ease-in-out infinite;

      pointer-events: none;

      z-index: 0;
    }

    .wave-1 {

      background: #7c8cff;

      top: -400px;
      left: -300px;
    }

    .wave-2 {

      background: #38bdf8;

      bottom: -450px;
      right: -300px;

      animation-delay: 4s;
    }

    @keyframes waveMove {

      0%,
      100% {
        transform: translate(0px, 0px);
      }

      50% {
        transform: translate(40px, -30px);
      }

    }

    /* ================= REVEAL ANIMATION ================= */

    .reveal {

      opacity: 0;

      transform: translateY(40px);

      transition:
        opacity .8s ease,
        transform .8s ease;
    }

    .reveal.active {

      opacity: 1;

      transform: translateY(0px);
    }

    /* ================= CURSOR GLOW ================= */

    .cursor-glow {

      position: fixed;

      width: 300px;
      height: 300px;

      border-radius: 9999px;

      background:
        radial-gradient(circle,
          rgba(124, 140, 255, .12),
          transparent 70%);

      pointer-events: none;

      z-index: 1;

      transform: translate(-50%, -50%);

      transition:
        transform .08s linear;
    }

    /* ================= MIC WAVES ================= */

    .mic-listening {

      position: relative;

      overflow: visible !important;
    }

    .mic-listening::before,
    .mic-listening::after {

      content: "";

      position: absolute;

      inset: -10px;

      border-radius: 24px;

      border: 1px solid rgba(165, 180, 252, .35);

      animation: micWave 2s infinite;
    }

    .mic-listening::after {
      animation-delay: 1s;
    }

    @keyframes micWave {

      0% {
        transform: scale(.95);
        opacity: .8;
      }

      100% {
        transform: scale(1.35);
        opacity: 0;
      }

    }

    /* ================= AI SPEAKING ================= */

    .ai-speaking {

      position: relative;
    }

    .ai-speaking::after {

      content: "";

      position: absolute;

      inset: -6px;

      border-radius: 24px;

      border: 1px solid rgba(125, 211, 252, .35);

      animation: aiSpeakingWave 1.6s infinite;
    }

    @keyframes aiSpeakingWave {

      0% {
        transform: scale(.95);
        opacity: .8;
      }

      100% {
        transform: scale(1.25);
        opacity: 0;
      }

    }
  </style>
</head>

<body class="text-white min-h-screen grid-bg relative overflow-x-hidden">

  <!-- CURSOR GLOW -->
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- WAVES -->
  <div class="animated-wave wave-1"></div>
  <div class="animated-wave wave-2"></div>

  <!-- ORBS -->
  <div class="floating-orb orb-1"></div>
  <div class="floating-orb orb-2"></div>

  <!-- PARTICLES -->
  <div class="particles" id="particles"></div>

  {% block content %}{% endblock %}
  <script>

    /* ================= PARTICLES ================= */

    const particlesContainer =
      document.getElementById("particles");

    for (let i = 0; i < 65; i++) {

      const particle =
        document.createElement("div");

      particle.classList.add("particle");

      particle.style.left =
        Math.random() * 100 + "vw";

      particle.style.top =
        Math.random() * 100 + "vh";

      particle.style.animationDuration =
        (10 + Math.random() * 18) + "s";

      particle.style.animationDelay =
        Math.random() * 10 + "s";

      particle.style.opacity =
        (.2 + Math.random() * .5);

      particlesContainer.appendChild(particle);

    }

    /* ================= CURSOR GLOW ================= */

    const glow =
      document.getElementById("cursorGlow");

    window.addEventListener("mousemove", (e) => {

      glow.style.left = e.clientX + "px";

      glow.style.top = e.clientY + "px";

    });

    /* ================= REVEAL ================= */

    const reveals =
      document.querySelectorAll(".reveal");

    function revealSections() {

      reveals.forEach(section => {

        const top =
          section.getBoundingClientRect().top;

        if (top < window.innerHeight - 100) {

          section.classList.add("active");

        }

      });

    }

    window.addEventListener("scroll", revealSections);

    revealSections();

  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/js/chat.js"></script>
</body>

</html>
